<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontawesome-4.7@4.7.0/css/font-awesome.min.css" />
    <link rel="icon" href="assets/img/under-construction.png" />
    <!-- Using Tailwind CSS CDN for ease of use -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font or additional styling if needed */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
    </style>
</head>

<!-- Setting white background and ensuring content is centered on the screen -->

<body class="bg-white min-h-screen flex items-center justify-center p-4">

    <!-- Main Container (Creating a focused and centralized look) -->
    <div
        class="max-w-xl w-full text-center bg-white shadow-2xl rounded-lg p-10 border-t-8 border-blue-600 transition duration-500 hover:shadow-3xl">

        <!-- Icon/Visual Element (Minimalist construction symbol) -->
        <div class="mb-6 mx-auto w-20 h-20 flex items-center justify-center">
            <!-- Minimalist Construction Symbol SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-blue-600 animate-pulse" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
        </div>

        <!-- Main Title (Impactful) -->
        <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
            Under Construction
        </h1>

        <!-- Main Message -->
        <p class="text-xl text-gray-600 mb-8 leading-relaxed">
            Big ideas are <a class="underline decoration-blue-500 font-semibold">brewing</a> and pixels are <a
                class="underline decoration-blue-500 font-semibold">moving!</a> I'm redesigning this Portfolio to
            better
            showcase my work (and
            personality). Swing back soon for grand reveal!
        </p>

        <!-- Timeline Detail (Key Message) -->
        <div class="bg-blue-50 border-l-4 border-blue-600 p-6 rounded-md shadow-inner">
            <p class="text-lg font-semibold text-gray-800 mb-2 flex items-center">
                <!-- Calendar Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-blue-600" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Estimated Completion: Q4 2026
            </p>
            <p class="text-sm text-gray-500">
                I apologize for any inconvenience and I appreciate your patience!
            </p>
        </div>

        <!-- Call to Action (CTA) - Link ke halaman yang lebih siap -->
        <a href="https://brillyarma.github.io/" class="mt-4 inline-flex items-center justify-center w-full py-3 px-6 text-lg font-semibold rounded-xl border-2 border-blue-600 
    text-blue-600 bg-white hover:bg-blue-50 transition duration-300 shadow-md hover:shadow-lg">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
            View Portfolio Now &rarr;
        </a>

    </div>

</body>

</html>
