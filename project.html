    <style>
      .code-tag {
        font-family: "JetBrains Mono", monospace;
      }
      .code-tag span {
        font-size: 13px;
        color: DodgerBlue;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }

      /* ===== Custom navbar with CSS ===== */
      #nav-toggle {
        display: none;
      }
      #nav-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #000;
        padding: 1rem 1.5rem;
        border-top: 1px solid #1f2937;
      }
      #nav-menu.open {
        display: block;
      }
      #nav-menu li + li {
        margin-top: 0.5rem;
      }
      #nav-menu a {
        display: block;
        padding: 0.25rem 0;
        color: #fff;
      }
      #nav-menu a:hover {
        color: #818cf8;
      }
      @media (max-width: 1023px) {
        #nav-toggle {
          display: block;
        }
      }
      @media (min-width: 1024px) {
        #nav-menu {
          display: flex;
          position: static;
          width: auto;
          background: transparent;
          padding: 0;
          border: 0;
        }
        #nav-menu li + li {
          margin: 0 0 0 2rem;
        }
      }
    </style>
  </head>
